spring.application.name=eventus
spring.datasource.url=jdbc:h2:file:./data/eventus;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT (defina JWT_SECRET em producao, minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:eventus-dev-secret-troque-em-producao-0123456789}
app.jwt.expiration-minutes=60

# Upload de imagem de capa (max 2 MB)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
